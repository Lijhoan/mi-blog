  </g>

  <g stroke="rgba(237,237,237,0.45)" stroke-width="2" marker-end="url(#arr3)">
    <line x1="364" y1="230" x2="442" y2="230"/>
    <line x1="750" y1="230" x2="828" y2="230"/>
  </g>

  <!-- return path -->
  <line x1="986" y1="300" x2="986" y2="380" stroke="rgba(237,237,237,0.45)" stroke-width="2"/>
  <line x1="986" y1="380" x2="214" y2="380" stroke="rgba(237,237,237,0.45)" stroke-width="2"/>
  <line x1="214" y1="380" x2="214" y2="452" stroke="rgba(237,237,237,0.45)" stroke-width="2" marker-end="url(#arr3)"/>
  <text x="600" y="366" fill="rgba(237,237,237,0.55)" font-size="20" letter-spacing="3" text-anchor="middle">EXTRACCIÓN DE MOVIMIENTOS · NORMALIZACIÓN</text>

  <!-- zero trust api -->
  <rect x="64" y="460" width="686" height="150" fill="#0a0a0a" stroke="#d71920" stroke-width="2"/>
  <circle cx="104" cy="535" r="6" fill="#d71920"/>
  <text x="130" y="526" fill="#ededed" font-size="24" font-weight="700" letter-spacing="3">REST API · ARQUITECTURA ZERO TRUST</text>
  <text x="130" y="566" fill="rgba(237,237,237,0.55)" font-size="22" letter-spacing="2">SIN CREDENCIALES PERSISTIDAS · SECRETOS EFÍMEROS</text>

  <rect x="836" y="460" width="300" height="150" fill="url(#hatch3)" stroke="rgba(237,237,237,0.25)" stroke-width="2"/>
  <text x="986" y="526" fill="#ededed" font-size="24" font-weight="700" letter-spacing="2" text-anchor="middle">PODMAN</text>
  <text x="986" y="558" fill="rgba(237,237,237,0.55)" font-size="22" letter-spacing="2" text-anchor="middle">AISLAMIENTO</text>
  <line x1="750" y1="535" x2="828" y2="535" stroke="rgba(237,237,237,0.45)" stroke-width="2" marker-end="url(#arr3)"/>

