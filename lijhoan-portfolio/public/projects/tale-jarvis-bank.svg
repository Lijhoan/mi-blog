    <text x="214" y="250">EJECUCIÓN PROGRAMADA</text>
    <text x="600" y="218">PYTHON 3.12</text>
    <text x="600" y="250">+ PLAYWRIGHT</text>
    <text x="986" y="218">PORTAL BANCARIO</text>
