  <text x="64" y="728" fill="rgba(237,237,237,0.32)" font-size="20" letter-spacing="4">AUTOMATIZACIÓN BANCARIA · SIN INTERVENCIÓN MANUAL</text>
  <text x="1136" y="728" fill="rgba(237,237,237,0.32)" font-size="20" letter-spacing="4" text-anchor="end">[ 2024 ]</text>
