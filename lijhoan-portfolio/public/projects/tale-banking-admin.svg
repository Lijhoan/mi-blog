<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="'Space Mono', ui-monospace, monospace">
  <defs>
    <pattern id="hatch2" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#0a0a0a"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="rgba(237,237,237,0.06)" stroke-width="2"/>
    </pattern>
    <marker id="arr2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="rgba(237,237,237,0.45)" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#0a0a0a"/>
  <rect x="1" y="1" width="1198" height="758" fill="none" stroke="rgba(237,237,237,0.14)" stroke-width="2"/>

  <!-- header -->
  <line x1="0" y1="86" x2="1200" y2="86" stroke="rgba(237,237,237,0.14)" stroke-width="2"/>
  <circle cx="64" cy="43" r="7" fill="#d71920"/>
  <text x="92" y="52" fill="#ededed" font-size="26" font-weight="700" letter-spacing="6">ARQUITECTURA — TALE BANKING ADMIN</text>
  <text x="1136" y="52" fill="rgba(237,237,237,0.32)" font-size="22" letter-spacing="4" text-anchor="end">A.02</text>

  <!-- flow row -->
  <g stroke="rgba(237,237,237,0.25)" stroke-width="2" fill="url(#hatch2)">
    <rect x="64" y="180" width="230" height="150"/>
    <rect x="368" y="180" width="230" height="150"/>
    <rect x="672" y="180" width="230" height="150"/>
    <rect x="906" y="180" width="230" height="150"/>
  </g>

  <g fill="#ededed" font-size="24" font-weight="700" letter-spacing="2" text-anchor="middle">
    <text x="179" y="240">NEXTAUTH</text>
    <text x="179" y="272">SESIÓN + ROLES</text>
    <text x="483" y="240">NEXT.JS</text>
    <text x="483" y="272">ADMIN CORE</text>
    <text x="787" y="240">PRISMA ORM</text>
    <text x="787" y="272">CONTRATOS</text>
    <text x="1021" y="240">POSTGRESQL</text>
    <text x="1021" y="272">CUENTAS</text>
