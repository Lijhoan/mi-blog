  <g stroke="rgba(237,237,237,0.45)" stroke-width="2" marker-end="url(#arr2)">
    <line x1="294" y1="255" x2="360" y2="255"/>
    <line x1="598" y1="255" x2="664" y2="255"/>
    <line x1="902" y1="255" x2="898" y2="255"/>
  </g>

  <!-- audit ledger -->
  <rect x="64" y="470" width="1072" height="150" fill="#0a0a0a" stroke="#d71920" stroke-width="2"/>
  <circle cx="104" cy="545" r="6" fill="#d71920"/>
  <text x="130" y="536" fill="#ededed" font-size="24" font-weight="700" letter-spacing="3">AUDITORÍA INMUTABLE · APPEND-ONLY</text>
  <text x="130" y="576" fill="rgba(237,237,237,0.55)" font-size="22" letter-spacing="2">CADA OPERACIÓN REGISTRADA · CUMPLIMIENTO REGULATORIO · TRAZABILIDAD TOTAL</text>

  <line x1="483" y1="338" x2="483" y2="462" stroke="rgba(237,237,237,0.45)" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="1021" y1="338" x2="1021" y2="462" stroke="rgba(237,237,237,0.45)" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- footer -->
  <line x1="0" y1="684" x2="1200" y2="684" stroke="rgba(237,237,237,0.14)" stroke-width="2"/>
  <text x="64" y="728" fill="rgba(237,237,237,0.32)" font-size="20" letter-spacing="4">DOCKER · TYPESCRIPT · TAILWIND CSS</text>
  <text x="1136" y="728" fill="rgba(237,237,237,0.32)" font-size="20" letter-spacing="4" text-anchor="end">[ 2024 ]</text>
