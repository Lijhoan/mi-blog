<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="'Space Mono', ui-monospace, monospace">
  <defs>
    <pattern id="hatchL" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#0a0a0a"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="rgba(237,237,237,0.06)" stroke-width="2"/>
    </pattern>
    <marker id="arrL" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="rgba(237,237,237,0.45)" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#0a0a0a"/>
  <rect x="1" y="1" width="1198" height="758" fill="none" stroke="rgba(237,237,237,0.14)" stroke-width="2"/>

  <!-- header -->
  <line x1="0" y1="86" x2="1200" y2="86" stroke="rgba(237,237,237,0.14)" stroke-width="2"/>
  <circle cx="64" cy="43" r="7" fill="#d71920"/>
  <text x="92" y="52" fill="#ededed" font-size="26" font-weight="700" letter-spacing="6">PLATAFORMA S10 LAKEHOUSE — MEDALLION</text>
  <text x="1136" y="52" fill="rgba(237,237,237,0.32)" font-size="22" letter-spacing="4" text-anchor="end">A.00</text>

  <!-- row 1: origen → ingesta → bronze -->
  <g stroke="rgba(237,237,237,0.25)" stroke-width="2" fill="url(#hatchL)">
    <rect x="64" y="140" width="250" height="120"/>
    <rect x="390" y="140" width="250" height="120"/>
    <rect x="716" y="140" width="200" height="120"/>
  </g>
  <rect x="992" y="140" width="144" height="120" fill="url(#hatchL)" stroke="rgba(237,237,237,0.25)" stroke-width="2"/>

  <g fill="#ededed" font-size="22" font-weight="700" letter-spacing="2" text-anchor="middle">
    <text x="189" y="190">ERP S10</text>
    <text x="189" y="220">SQL SERVER</text>
    <text x="515" y="190">PYTHON · PYODBC</text>
    <text x="515" y="220">INGESTION-RUNNER</text>
    <text x="816" y="190">PARQUET</text>
    <text x="816" y="220">MINIO (S3)</text>
    <text x="1064" y="190">ICEBERG</text>
    <text x="1064" y="220">+ CATÁLOGO</text>
  </g>

  <g stroke="rgba(237,237,237,0.45)" stroke-width="2" marker-end="url(#arrL)">
    <line x1="314" y1="200" x2="382" y2="200"/>
    <line x1="640" y1="200" x2="708" y2="200"/>
    <line x1="916" y1="200" x2="984" y2="200"/>
  </g>

  <!-- orquestación -->
  <rect x="64" y="320" width="576" height="100" fill="#0a0a0a" stroke="rgba(237,237,237,0.25)" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="96" y="362" fill="#ededed" font-size="22" font-weight="700" letter-spacing="2">APACHE AIRFLOW · DAG DELGADO</text>
  <text x="96" y="394" fill="rgba(237,237,237,0.55)" font-size="20" letter-spacing="2">RUNTIME-AGENT EXTERNO · AUDITORÍA DE EJECUCIONES</text>
  <line x1="515" y1="320" x2="515" y2="268" stroke="rgba(237,237,237,0.45)" stroke-width="2" marker-end="url(#arrL)"/>

  <!-- seguridad -->
  <rect x="716" y="320" width="420" height="100" fill="#0a0a0a" stroke="#d71920" stroke-width="2"/>
  <circle cx="748" cy="370" r="6" fill="#d71920"/>
  <text x="772" y="362" fill="#ededed" font-size="22" font-weight="700" letter-spacing="2">OPENBAO · SECRETOS</text>
  <text x="772" y="394" fill="rgba(237,237,237,0.55)" font-size="20" letter-spacing="2">APPROLE · MÍNIMO PRIVILEGIO</text>

  <!-- row 2: capas medallion → trino → power bi -->
  <g stroke="rgba(237,237,237,0.25)" stroke-width="2" fill="url(#hatchL)">
    <rect x="64" y="480" width="160" height="110"/>
    <rect x="256" y="480" width="160" height="110"/>
    <rect x="448" y="480" width="160" height="110"/>
    <rect x="716" y="480" width="180" height="110"/>
  </g>
  <rect x="972" y="480" width="164" height="110" fill="#0a0a0a" stroke="rgba(237,237,237,0.25)" stroke-width="2"/>

  <g fill="#ededed" font-size="22" font-weight="700" letter-spacing="2" text-anchor="middle">
    <text x="144" y="528">BRONZE</text>
    <text x="336" y="528">SILVER</text>
    <text x="528" y="528">GOLD</text>
    <text x="806" y="528">TRINO</text>
    <text x="1054" y="528">POWER BI</text>
  </g>
  <g fill="rgba(237,237,237,0.55)" font-size="18" letter-spacing="2" text-anchor="middle">
    <text x="144" y="558">ORIGINAL</text>
    <text x="336" y="558">DEPURADO</text>
    <text x="528" y="558">NEGOCIO</text>
    <text x="806" y="558">SQL DISTRIBUIDO</text>
    <text x="1054" y="558">KPIS · GERENCIA</text>
  </g>
  <text x="336" y="466" fill="rgba(237,237,237,0.55)" font-size="19" letter-spacing="3" text-anchor="middle">DBT CORE — TRANSFORMACIÓN POR CAPAS</text>

  <g stroke="rgba(237,237,237,0.45)" stroke-width="2" marker-end="url(#arrL)">
    <line x1="224" y1="535" x2="248" y2="535"/>
    <line x1="416" y1="535" x2="440" y2="535"/>
    <line x1="608" y1="535" x2="708" y2="535"/>
    <line x1="896" y1="535" x2="964" y2="535"/>
  </g>
  <line x1="816" y1="260" x2="816" y2="472" stroke="rgba(237,237,237,0.3)" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- footer -->
  <line x1="0" y1="684" x2="1200" y2="684" stroke="rgba(237,237,237,0.14)" stroke-width="2"/>
  <text x="64" y="728" fill="rgba(237,237,237,0.32)" font-size="20" letter-spacing="4">3 SERVIDORES LINUX · JENKINS + GITEA (CI/CD) · OBSERVABILIDAD</text>
  <text x="1136" y="728" fill="rgba(237,237,237,0.32)" font-size="20" letter-spacing="4" text-anchor="end">[ 2025–2026 ]</text>
</svg>
