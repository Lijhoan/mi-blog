<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="'Space Mono', ui-monospace, monospace">
  <defs>
    <pattern id="hatch" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#0a0a0a"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="rgba(237,237,237,0.06)" stroke-width="2"/>
    </pattern>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="rgba(237,237,237,0.45)" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#0a0a0a"/>
  <rect x="1" y="1" width="1198" height="758" fill="none" stroke="rgba(237,237,237,0.14)" stroke-width="2"/>

  <!-- header -->
  <line x1="0" y1="86" x2="1200" y2="86" stroke="rgba(237,237,237,0.14)" stroke-width="2"/>
  <circle cx="64" cy="43" r="7" fill="#d71920"/>
  <text x="92" y="52" fill="#ededed" font-size="26" font-weight="700" letter-spacing="6">ARQUITECTURA — TALE INSIGHT ANALYTICS</text>
  <text x="1136" y="52" fill="rgba(237,237,237,0.32)" font-size="22" letter-spacing="4" text-anchor="end">A.01</text>

  <!-- flow row -->
  <g stroke="rgba(237,237,237,0.25)" stroke-width="2" fill="url(#hatch)">
    <rect x="64" y="180" width="230" height="150"/>
    <rect x="368" y="180" width="230" height="150"/>
    <rect x="672" y="180" width="230" height="150"/>
    <rect x="906" y="470" width="230" height="150" />
  </g>
  <rect x="906" y="180" width="230" height="150" fill="#0a0a0a" stroke="#d71920" stroke-width="2"/>

  <g fill="#ededed" font-size="24" font-weight="700" letter-spacing="2" text-anchor="middle">
    <text x="179" y="240">FUENTES</text>
    <text x="179" y="272">OPERATIVAS</text>
    <text x="483" y="240">POSTGRESQL 16</text>
    <text x="483" y="272">MODELO GOBERNADO</text>
    <text x="787" y="240">NEXT.JS 15</text>
    <text x="787" y="272">SHELL DE PRODUCTO</text>
    <text x="1021" y="240">POWER BI</text>
    <text x="1021" y="272">EMBEBIDO</text>
  </g>

  <g stroke="rgba(237,237,237,0.45)" stroke-width="2" marker-end="url(#arr)">
    <line x1="294" y1="255" x2="360" y2="255"/>
    <line x1="598" y1="255" x2="664" y2="255"/>
    <line x1="902" y1="255" x2="898" y2="255"/>
  </g>

  <!-- auth layer -->
  <rect x="64" y="470" width="838" height="150" fill="#0a0a0a" stroke="rgba(237,237,237,0.25)" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="104" cy="545" r="6" fill="#d71920"/>
  <text x="130" y="536" fill="#ededed" font-size="24" font-weight="700" letter-spacing="3">JWT · CONTROL DE ACCESO POR ÁREAS</text>
  <text x="130" y="576" fill="rgba(237,237,237,0.55)" font-size="22" letter-spacing="2">8 ÁREAS / 28 SUB-ÁREAS · SESIONES GOBERNADAS</text>

  <line x1="483" y1="470" x2="483" y2="338" stroke="rgba(237,237,237,0.45)" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="787" y1="470" x2="787" y2="338" stroke="rgba(237,237,237,0.45)" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1021" y1="470" x2="1021" y2="338" stroke="rgba(237,237,237,0.45)" stroke-width="2" marker-end="url(#arr)"/>

  <!-- footer -->
  <line x1="0" y1="684" x2="1200" y2="684" stroke="rgba(237,237,237,0.14)" stroke-width="2"/>
  <text x="64" y="728" fill="rgba(237,237,237,0.32)" font-size="20" letter-spacing="4">PODMAN · ROCKY LINUX 9.7 · DESPLIEGUE CORPORATIVO</text>
  <text x="1136" y="728" fill="rgba(237,237,237,0.32)" font-size="20" letter-spacing="4" text-anchor="end">[ 2024 ]</text>
